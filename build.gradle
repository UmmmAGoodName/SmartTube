// Top-level build file where you can add configuration options common to all sub-projects/modules.
apply from: gradle.ext.sharedModulesConstants

// NOT working
// Running 'gradle wrapper' will generate gradlew
wrapper {
    gradleVersion = gradleVersion
    distributionType = Wrapper.DistributionType.BIN
}

buildscript {
    apply from: gradle.ext.sharedModulesConstants

    repositories {
        google()
        mavenCentral()
        // IntelliJ 'Read timed out' (error 403)
        // https://stackoverflow.com/questions/74258160/is-jcenter-down-permanently-31-oct
        //jcenter()
    }
    dependencies {
        // AGP bump (Compose-for-TV migration prerequisite): 7.4.2 predates the compatibility
        // rules AGP needs to disambiguate Compose UI's Kotlin-Multiplatform-published variants
        // (androidRuntimeElements vs jvmStubsRuntimeElements) - resolution fails on literally any
        // current Compose version under 7.4.2. Verify latest stable AGP/Gradle pairing before
        // shipping: https://developer.android.com/build/releases/gradle-plugin#updating-gradle
        classpath 'com.android.tools.build:gradle:8.6.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:' + kotlinVersion

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// AGP 8+ turns the (previously just deprecated-warning) manifest `package=` attribute into a
// hard "specify a namespace" build error for any module missing an explicit `namespace` in its
// android {} block. sharedutils/sharedtests/appupdatechecker2/commons-io-2.8.0 (SharedModules)
// and mediaserviceinterfaces/youtubeapi (MediaServiceCore) are upstream git submodules
// (github.com/yuliskov/...) outside this repo's write access, so their build.gradle files can't
// be edited directly from here. Inject their namespace from this repo's root build.gradle instead
// - this only touches files inside the SmartTube repo itself.
// NOTE: must use plugins.withId(...), not afterEvaluate - AGP validates namespace as soon as the
// android-library plugin applies (registering its own afterEvaluate check at that point), which
// runs before an afterEvaluate hook registered externally from root would fire.
[
    ':sharedutils'          : 'com.liskovsoft.sharedutils',
    ':sharedtests'          : 'com.liskovsoft.sharedtests',
    ':appupdatechecker2'    : 'com.liskovsoft.appupdatechecker2',
    ':commons-io-2.8.0'     : 'org.apache.commons.commonsio',
    ':j2v8'                 : 'com.eclipsesource.v8',
    ':mediaserviceinterfaces': 'com.liskovsoft.mediaserviceinterfaces',
    ':youtubeapi'           : 'com.liskovsoft.youtubeapi',
].each { path, ns ->
    gradle.projectsLoaded {
        rootProject.project(path).plugins.withId('com.android.library') {
            rootProject.project(path).android.namespace = ns
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        //flatDir { dirs 'libs' } // include duktape-my to all subprojects
        // IntelliJ 'Read timed out' (error 403)
        // https://stackoverflow.com/questions/74258160/is-jcenter-down-permanently-31-oct
        //jcenter()
    }
    configurations.all {
        // WorkManager conflict resolution (lint exception: old java runtime)
        // resolutionStrategy.force 'androidx.lifecycle:lifecycle-livedata-core:' + liveDataVersion
        // resolutionStrategy.force 'androidx.lifecycle:lifecycle-livedata:' + liveDataVersion
        // resolutionStrategy.force 'androidx.lifecycle:lifecycle-runtime:' + liveDataVersion
        // Force Android 4 compatible okHttp version
        resolutionStrategy.force 'com.squareup.okhttp3:okhttp:' + okhttpVersion
        // Downgrade kotlin version for WorkManager
        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:' + kotlinVersion
        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:' + kotlinVersion
        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:' + kotlinVersion
        resolutionStrategy.force 'org.jetbrains.kotlinx:kotlinx-coroutines-android:' + kotlinxVersion
        resolutionStrategy.force 'androidx.core:core-ktx:' + kotlinCoreXVersion
        resolutionStrategy.force 'androidx.core:core:' + coreXVersion
        resolutionStrategy.force 'androidx.annotation:annotation:' + annotationXVersion
        // Downgrade Cronet version for cronet-okhttp
        resolutionStrategy.force 'org.chromium.net:cronet-api:' + cronetApiVersion
        resolutionStrategy.force 'androidx.multidex:multidex:' + multiDexVersion

        // Replace with modded library (leanback-1.0.0)
        exclude group: 'androidx.leanback', module: 'leanback'
        // Replace with modded library (fragment-1.1.0)
        exclude group: 'androidx.fragment', module: 'fragment'

        // Don't work! Replace with modded library (leanback-1.0.0)
        // resolutionStrategy.dependencySubstitution {
        //     // substitute remote dependency with local module
        //     substitute module('androidx.leanback:leanback') using project(':leanback-1.0.0')
        // }
    }
}